<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Appointment Booking</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6f8; display: flex;
         justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; padding: 2rem; border-radius: 10px; width: 320px;
          box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size: 1.3rem; margin-top: 0; }
  label { display: block; margin: .8rem 0 .25rem; font-size: .9rem; }
  input { width: 100%; padding: .55rem; border: 1px solid #ccc; border-radius: 6px;
          box-sizing: border-box; }
  button { width: 100%; margin-top: 1.2rem; padding: .6rem; border: 0; border-radius: 6px;
           background: #1a56db; color: #fff; font-size: 1rem; cursor: pointer; }
  button:hover { background: #1746b0; }
  .error { color: #c0392b; font-size: .85rem; min-height: 1.2em; margin-top: .6rem; }
  .hint { font-size: .75rem; color: #888; margin-top: 1rem; }
</style>
</head>
<body>
<div class="card">
  <h1>Appointment Booking</h1>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" required autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button type="submit">Log in</button>
    <div class="error" id="error"></div>
  </form>
  <div class="hint">Try: admin/admin123, alice/alice123, bob/bob123</div>
</div>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("error");
  errorEl.textContent = "";
  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value,
    }),
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    errorEl.textContent = data.detail || "Invalid username or password";
    return;
  }
  const data = await res.json();
  // token จริงอยู่ใน HttpOnly cookie แล้ว JS แตะไม่ได้ - เก็บแค่ข้อมูลโชว์หน้าจอ
  localStorage.setItem("username", data.username);
  localStorage.setItem("is_admin", data.is_admin);
  location.href = "/static/booking.html";
});
</script>
</body>
</html>
